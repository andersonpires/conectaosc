services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conectaosc_app
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_PUBLIC_BASE_URL: http://localhost:8080
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: mwtech63_matricula
      DB_USER: mwtech63_admin_matricula
      DB_PASS: change_me_db_user_password
    ports:
      - "8080:80"

  mysql:
    image: mysql:5.7
    container_name: conectaosc_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change_me_root_password
      MYSQL_DATABASE: mwtech63_matricula
      MYSQL_USER: mwtech63_admin_matricula
      MYSQL_PASSWORD: change_me_db_user_password
      TZ: America/Sao_Paulo
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=256M
    volumes:
      - mysql_data:/var/lib/mysql
      - ./banco/backup_2026-03-22_12-12-09.sql:/docker-entrypoint-initdb.d/01-backup.sql:ro

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: conectaosc_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_USER: root
      PMA_PASSWORD: change_me_root_password
      UPLOAD_LIMIT: 256M
      MEMORY_LIMIT: 512M
    ports:
      - "8081:80"

volumes:
  mysql_data:
