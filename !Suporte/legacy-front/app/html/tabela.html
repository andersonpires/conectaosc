<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela com Divs</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 3px;
            border-radius: 5px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 3px;
        }

        .col-2 {
            display: flex;
            width: 100%;
            padding: 3px;
            align-items: center;
            justify-content: center;
        }

        .col-foto {
            display: flex;
            padding: 3px;
        }

        .col {
             display: flex;
            flex-grow: 1; 
            padding: 3px;
        }

        .col-dados {
            width: 20%;
            padding: 3px;
        }

        .row {
            display: flex;
            flex: 1 1 500px;
            padding: 3px;
            background: #bfb9b9;
        }

        /* table {
            border-bottom: 1px solid #ccc;
            border: 1px solid #ccc;
        }

        td,
        th {
            padding: 5px;
            border-bottom: 1px solid #ccc;
            border-left:  1px solid #ccc;
            border-right:  1px solid #ccc;
            border-top:  1px solid #ccc;
        } */
    </style>
</head>

<body>

    <div class="container">
        <div class="col-2">
            <div class="col-foto">
                <img src="imagens/8c85764bfea00a842689b808031501fe.jpg" alt="">
            </div>
            <div class="col-dados">
                <div class="col">
                    <div class="row">Nome: </div>
                    <div class="row">CPF: </div>
                </div>
                <div class="col">
                    <div class="row">Nascimento: </div>
                    <div class="row">Sexo:</div>
                    <div class="row">WhatsApp:</div>
                </div>
            </div>

        </div>
    </div>

</html>
