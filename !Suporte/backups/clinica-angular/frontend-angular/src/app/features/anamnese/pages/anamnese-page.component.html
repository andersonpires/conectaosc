@if (loading) {
  <section class="state-card skeleton-shell">
    <div class="skeleton-line w-40"></div>
    <div class="skeleton-line w-85"></div>
    <div class="skeleton-line w-70"></div>
  </section>
} @else {
  <div class="page">
    <header class="top-head">
      <div class="line-1">
        <button type="button"><span class="material-symbols-outlined">arrow_back_ios</span></button>
        <h1>Anamnese do Paciente</h1>
        <div class="spacer"></div>
      </div>

      <div class="patient-row">
        <div class="avatar"><span class="material-symbols-outlined">person</span></div>
        <div>
          <p>{{ selectedPatientName || 'Paciente nao selecionado' }}</p>
          <small>Formulario clinico</small>
        </div>
      </div>
    </header>

    <section class="progress-wrap">
      <div>
        <span>Progresso do Preenchimento</span>
        <b>{{ progresso }}%</b>
      </div>
      <div class="bar"><i [style.width.%]="progresso"></i></div>
    </section>

    <main>
      @if (message) {
        <p class="msg success">{{ message }}</p>
      }
      @if (error) {
        <p class="msg error">{{ error }}</p>
      }

      <section class="card">
        <button class="card-head" type="button">
          <span><i class="material-symbols-outlined">badge</i> Identificacao</span>
          <i class="material-symbols-outlined">expand_more</i>
        </button>

        <div class="card-body grid-2">
          <div class="full">
            <label>Paciente</label>
            <select [ngModel]="selectedPatientId" (ngModelChange)="onPatientChange($event)">
              @for (patient of patients; track patient.aluno_id) {
                <option [value]="patient.aluno_id">{{ patient.paciente_nome }}</option>
              }
            </select>
          </div>
          <div>
            <label>Qualidade do Sono</label>
            <select [(ngModel)]="form.qualidade_sono">
              <option value="">Selecione</option>
              <option>Boa</option>
              <option>Regular</option>
              <option>Ruim</option>
            </select>
          </div>
          <div>
            <label>Dificuldades de memoria</label>
            <select [(ngModel)]="form.dificuldades_memoria">
              <option value="">Selecione</option>
              <option>Nao</option>
              <option>Leves</option>
              <option>Frequentes</option>
            </select>
          </div>
        </div>
      </section>

      <section class="card">
        <button class="card-head" type="button">
          <span><i class="material-symbols-outlined">psychiatry</i> Queixa Principal</span>
          <i class="material-symbols-outlined">expand_more</i>
        </button>
        <div class="card-body">
          <label>Crenca / Religiao</label>
          <textarea
            [(ngModel)]="form.crenca_religiao"
            rows="3"
            placeholder="Descreva como a espiritualidade influencia o cuidado..."
          ></textarea>

          <label>Sentimento nos ultimos meses</label>
          <textarea
            [(ngModel)]="form.sentimento_ultimos_meses"
            rows="3"
            placeholder="Relate humor, ansiedade, irritabilidade ou tristeza..."
          ></textarea>
        </div>
      </section>

      <section class="card">
        <button class="card-head" type="button">
          <span><i class="material-symbols-outlined">history_edu</i> Historico Clinico</span>
          <i class="material-symbols-outlined">expand_more</i>
        </button>
        <div class="card-body grid-2">
          <div>
            <label>Acompanhamento psicologico</label>
            <select [(ngModel)]="form.acompanhamento_psicologico">
              <option value="">Selecione</option>
              <option>Atual</option>
              <option>Passado</option>
              <option>Nunca</option>
            </select>
          </div>
          <div>
            <label>Medicacoes psicotropicos</label>
            <select [(ngModel)]="form.medicacoes_psicotropicos">
              <option value="">Selecione</option>
              <option>Sim</option>
              <option>Nao</option>
            </select>
          </div>
          <div class="full">
            <label>Internacao psiquiatrica</label>
            <select [(ngModel)]="form.internacao_psiquiatrica">
              <option value="">Selecione</option>
              <option>Nao</option>
              <option>Uma vez</option>
              <option>Mais de uma vez</option>
            </select>
          </div>
          <div class="full">
            <label>Atividades que fazem bem</label>
            <textarea [(ngModel)]="form.atividades_fazem_bem" rows="2" placeholder="Ex: caminhada, leitura, artesanato..."></textarea>
          </div>
          <div class="full">
            <label>Uso de alcool/substancias</label>
            <textarea [(ngModel)]="form.uso_alcool_substancias" rows="2" placeholder="Descreva frequencia e contexto..."></textarea>
          </div>
          <div class="full">
            <label>Observacoes gerais</label>
            <textarea [(ngModel)]="form.observacoes_gerais" rows="4" placeholder="Registre observacoes relevantes da entrevista..."></textarea>
          </div>
        </div>
      </section>
    </main>

    <div class="save-wrap">
      <button (click)="save()" [disabled]="saving" type="button">
        <span class="material-symbols-outlined">save</span>
        {{ saving ? 'Salvando...' : 'Salvar Anamnese' }}
      </button>
    </div>
  </div>
}
