<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Formulário de Anamnese Clínica</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "clinical-teal": "#0d9488",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
<div class="relative flex min-h-screen w-full max-w-[430px] mx-auto flex-col bg-white dark:bg-slate-900 shadow-2xl overflow-x-hidden pb-[160px]">
<div class="sticky top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3">
<div class="flex items-center justify-between mb-2">
<button class="flex items-center text-primary">
<span class="material-symbols-outlined text-[28px]">arrow_back_ios</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Anamnese do Paciente</h1>
<div class="w-7"></div> 
</div>
<div class="flex items-center gap-3">
<div class="size-10 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">person</span>
</div>
<div>
<p class="text-sm font-semibold leading-tight">João Silva</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Prontuário: #45829</p>
</div>
</div>
</div>
<div class="px-4 py-4">
<div class="flex items-center justify-between mb-2">
<span class="text-xs font-medium text-slate-600 dark:text-slate-400 uppercase tracking-wider">Progresso do Preenchimento</span>
<span class="text-xs font-bold text-primary">65%</span>
</div>
<div class="h-1.5 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full w-[65%]"></div>
</div>
</div>
<div class="flex flex-col gap-4 px-4">
<div class="border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden bg-white dark:bg-slate-800/50 shadow-sm">
<button class="w-full flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">badge</span>
<span class="font-bold text-base">Identificação</span>
</div>
<span class="material-symbols-outlined text-slate-400">expand_more</span>
</button>
<div class="p-4 grid grid-cols-2 gap-4">
<div class="col-span-1">
<label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-tighter">Idade</label>
<input class="w-full rounded-lg border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:ring-primary focus:border-primary" type="text" value="32 anos"/>
</div>
<div class="col-span-1">
<label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-tighter">Gênero</label>
<select class="w-full rounded-lg border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:ring-primary focus:border-primary">
<option>Masculino</option>
<option>Feminino</option>
<option>Outro</option>
</select>
</div>
<div class="col-span-2">
<label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-tighter">Ocupação</label>
<input class="w-full rounded-lg border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:ring-primary focus:border-primary" placeholder="Ex: Desenvolvedor" type="text"/>
</div>
</div>
</div>
<div class="border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden bg-white dark:bg-slate-800/50 shadow-sm">
<button class="w-full flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">psychiatry</span>
<span class="font-bold text-base">Queixa Principal</span>
</div>
<span class="material-symbols-outlined text-slate-400">expand_more</span>
</button>
<div class="p-4">
<label class="block text-xs font-semibold text-slate-500 mb-2 uppercase tracking-tighter">Descrição Detalhada</label>
<textarea class="w-full rounded-lg border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:ring-primary focus:border-primary" placeholder="Descreva os sintomas atuais e motivo da consulta..." rows="4"></textarea>
</div>
</div>
<div class="border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden bg-white dark:bg-slate-800/50 shadow-sm">
<button class="w-full flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">history_edu</span>
<span class="font-bold text-base">Histórico Clínico</span>
</div>
<span class="material-symbols-outlined text-slate-400">expand_more</span>
</button>
<div class="p-4 space-y-4">
<div class="flex items-center justify-between py-2">
<span class="text-sm font-medium">Possui Alergias?</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<input class="w-full rounded-lg border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:ring-primary focus:border-primary" placeholder="Descreva as alergias..." type="text"/>
<div class="pt-2">
<p class="text-xs font-semibold text-slate-500 mb-3 uppercase tracking-tighter">Sintomas Recorrentes</p>
<div class="grid grid-cols-1 gap-3">
<label class="flex items-center gap-3 p-3 rounded-lg bg-slate-50 dark:bg-slate-800/80 border border-slate-100 dark:border-slate-700">
<input class="rounded text-primary focus:ring-primary size-5 border-slate-300" type="checkbox"/>
<span class="text-sm">Dores de Cabeça</span>
</label>
<label class="flex items-center gap-3 p-3 rounded-lg bg-slate-50 dark:bg-slate-800/80 border border-slate-100 dark:border-slate-700">
<input class="rounded text-primary focus:ring-primary size-5 border-slate-300" type="checkbox"/>
<span class="text-sm">Insônia / Distúrbios do Sono</span>
</label>
<label class="flex items-center gap-3 p-3 rounded-lg bg-slate-50 dark:bg-slate-800/80 border border-slate-100 dark:border-slate-700">
<input checked="" class="rounded text-primary focus:ring-primary size-5 border-slate-300" type="checkbox"/>
<span class="text-sm">Ansiedade ou Stress</span>
</label>
</div>
</div>
</div>
</div>
<div class="border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden bg-white dark:bg-slate-800/50 shadow-sm">
<button class="w-full flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">fitness_center</span>
<span class="font-bold text-base">Estilo de Vida</span>
</div>
<span class="material-symbols-outlined text-slate-400">expand_more</span>
</button>
<div class="p-4 space-y-4">
<div>
<label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-tighter">Atividade Física (Freqüência)</label>
<select class="w-full rounded-lg border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:ring-primary focus:border-primary">
<option>Sedentário</option>
<option>1-2 vezes por semana</option>
<option>3-5 vezes por semana</option>
<option>Diariamente</option>
</select>
</div>
<div>
<label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-tighter">Qualidade da Dieta</label>
<div class="flex gap-2">
<button class="flex-1 py-2 text-xs font-medium border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-primary/5">Ruim</button>
<button class="flex-1 py-2 text-xs font-medium border border-primary bg-primary/10 rounded-lg">Média</button>
<button class="flex-1 py-2 text-xs font-medium border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-primary/5">Boa</button>
</div>
</div>
</div>
</div>
</div>
<div class="fixed bottom-[88px] left-1/2 -translate-x-1/2 w-full max-w-[430px] p-4 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 z-40">
<button class="w-full bg-clinical-teal hover:bg-teal-700 text-white font-bold py-4 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
                Salvar Anamnese
            </button>
</div>
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] flex items-center justify-around border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900 px-2 pb-6 pt-2 z-50">
<a class="flex flex-1 flex-col items-center gap-0.5 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined text-[26px]">home</span>
<p class="text-[10px] font-medium">Início</p>
</a>
<a class="flex flex-1 flex-col items-center gap-0.5 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined text-[26px]">calendar_today</span>
<p class="text-[10px] font-medium">Agenda</p>
</a>
<a class="flex flex-1 flex-col items-center gap-0.5 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined text-[26px]">group</span>
<p class="text-[10px] font-medium">Pacientes</p>
</a>
<a class="flex flex-1 flex-col items-center gap-0.5 text-primary" href="#">
<span class="material-symbols-outlined text-[26px] font-variation-fill">description</span>
<p class="text-[10px] font-medium">Prontuário</p>
</a>
<a class="flex flex-1 flex-col items-center gap-0.5 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined text-[26px]">settings</span>
<p class="text-[10px] font-medium">Ajustes</p>
</a>
</div>
</div>

</body></html>
