<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="icon-48x48.png" />
    <title>Fortalecimento do 3o Setor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: sans-serif;
            background-color: #f8f8f8; /* Cor de fundo suave */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            /* Adicionando gradiente linear ao fundo */
            background: linear-gradient(to bottom, #f8f8f8, #ffffff);
            overflow-x: hidden; /* Evita rolagem horizontal em telas menores */
        }

        .logo-container {
            width: 300px;
            margin-bottom: 20px;
            overflow: hidden; /* Garante que a imagem não ultrapasse o contêiner */
            display: flex;
            justify-content: center;
        }

        .logo-container img {
            max-width: 100%; /* Largura máxima da imagem */
            height: auto; /* Altura automática */
            display: block; /* Evita espaços em branco abaixo da imagem */
        }

        .btn-primary {
            background-color: #ff9800; /* Laranja vibrante */
            border-color: #ff9800;
            margin-bottom: 10px;
            width: 100%; /* Largura total dos botões */
            transition: transform 0.2s ease-in-out; /* Adiciona transição suave */
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2); /* Sombra nos botões */
        }

        .btn-primary:hover {
            background-color: #f57c00; /* Laranja mais escuro no hover */
            border-color: #f57c00;
            transform: scale(1.05); /* Efeito de escala no hover */
        }

        .btn-container {
            display: flex;
            flex-direction: column; /* Coloca os botões em coluna */
            width: 100%;
            max-width: 400px; /* Largura máxima do container de botões */
        }

        /* Animação de entrada suave */
        .animated-element {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        .animated-element.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="logo-container animated-element">
        <img src="logo.png" alt="Logo">
    </div>

    <div class="btn-container animated-element">
        <a href="https://chat.whatsapp.com/KvOMx8WKXAd4gVfM30K9JG" class="btn btn-primary">Faça parte do grupo de WhatsApp AVISOS</a>
        <a href="https://chat.whatsapp.com/FBSrMoQBAVfKjz9ZokXIo2" class="btn btn-primary">Entrar para comunidade Fortalecimento 3o setor</a>
        <a href="https://1drv.ms/f/s!AmtY3_pDDneMmct2jrrbOVEEwtJm_g?e=jY2Ne4" class="btn btn-primary">Acessar arquivos no drive</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Função para adicionar a classe 'active' aos elementos animados quando a página carrega
        window.addEventListener('load', () => {
            const animatedElements = document.querySelectorAll('.animated-element');
            animatedElements.forEach(element => {
                element.classList.add('active');
            });
        });
    </script>
</body>

</html>
