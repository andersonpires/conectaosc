<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Clínica - ConectaOSC</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'template-primary': '#222E3C',
            'template-secondary': '#F5F7FB',
            'monday-blue': '#222E3C',
            'monday-blue-light': '#2e4054',
            'purple-accent': '#6b4ea2',
            'purple-accent-hover': '#5a4290',
            primary: '#18385c',
            secondary: '#2c5a8a'
          },
          fontFamily: { sans: ['Figtree', 'system-ui', 'sans-serif'], mono: ['Roboto Mono', 'monospace'] },
          boxShadow: {
            'monday': '0 2px 8px rgba(24, 56, 92, 0.15)',
            'monday-lg': '0 4px 20px rgba(24, 56, 92, 0.2)'
          },
          minHeight: { 'touch': '44px' },
          minWidth: { 'touch': '44px' }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tiny.cloud/1/maa7p6ervwrty9h84gphxrsrfking1awabjrp7tak98iuwjh/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Figtree', system-ui, sans-serif; }
    @media (min-width: 768px) {
      #app { max-width: 100%; }
      #main-content { max-width: 900px; margin: 0 auto; }
      nav { max-width: 900px; left: 50% !important; transform: translateX(-50%); border-radius: 1rem 1rem 0 0; }
    }
    @media (min-width: 1200px) {
      #main-content { max-width: 1100px; }
      nav { max-width: 1100px; }
    }
  </style>
</head>
<body class="font-sans bg-slate-100 text-gray-800 antialiased pb-20">
  <div id="app" class="min-h-screen bg-white md:min-h-screen">
    <header class="bg-monday-blue text-white shadow-monday sticky top-0 z-10">
      <div class="px-4 py-3 flex items-center justify-between gap-3">
        <img src="../assets/img/sistema/logo.png" alt="Logo" class="h-8 md:h-9 object-contain" onerror="this.style.display='none'">
        <h1 class="text-lg font-semibold tracking-tight">App Clínica</h1>
      </div>
    </header>
    <main id="main-content" class="p-4">
      <p class="text-gray-500">Carregando...</p>
    </main>
    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-gray-200 shadow-monday z-20 safe-area-pb">
      <div class="flex justify-around py-2">
        <button type="button" data-page="pacientes" class="nav-btn flex flex-col items-center justify-center min-h-touch min-w-touch px-4 py-2 rounded-lg text-gray-500 hover:text-monday-blue focus-visible:ring-2 focus-visible:ring-monday-blue focus-visible:ring-offset-2 transition" aria-label="Pacientes">
          <i data-lucide="users" class="w-6 h-6 mb-0.5"></i>
          <span class="text-xs">Pacientes</span>
        </button>
        <button type="button" data-page="agenda" class="nav-btn flex flex-col items-center justify-center min-h-touch min-w-touch px-4 py-2 rounded-lg text-gray-500 hover:text-monday-blue focus-visible:ring-2 focus-visible:ring-monday-blue focus-visible:ring-offset-2 transition" aria-label="Agenda">
          <i data-lucide="calendar" class="w-6 h-6 mb-0.5"></i>
          <span class="text-xs">Agenda</span>
        </button>
        <button type="button" data-page="prontuarios" class="nav-btn flex flex-col items-center justify-center min-h-touch min-w-touch px-4 py-2 rounded-lg text-gray-500 hover:text-monday-blue focus-visible:ring-2 focus-visible:ring-monday-blue focus-visible:ring-offset-2 transition" aria-label="Prontuário">
          <i data-lucide="file-text" class="w-6 h-6 mb-0.5"></i>
          <span class="text-xs">Prontuário</span>
        </button>
        <button type="button" data-page="atendimento" class="nav-btn flex flex-col items-center justify-center min-h-touch min-w-touch px-4 py-2 rounded-lg text-gray-500 hover:text-monday-blue focus-visible:ring-2 focus-visible:ring-monday-blue focus-visible:ring-offset-2 transition" aria-label="Atendimento">
          <i data-lucide="stethoscope" class="w-6 h-6 mb-0.5"></i>
          <span class="text-xs">Atendimento</span>
        </button>
      </div>
    </nav>
  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
